<script>
'use strict';
/* ===================== 유틸 ===================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function shuffle(r,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function hash2(x,y,s){let h=(x*374761393+y*668265263+(s|0)*1442695041)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ===================== 설정 ===================== */
const DEF_SET={master:.8,music:.6,sfx:.9,monster:.9,ambient:.7,steps:.7,cut:.9,
 res:1,shake:1,lightQ:1,shadows:true,particles:1,vfx:true,camSmooth:.12,brightness:1,glow:1,
 moveSens:1,joySize:1,btnSize:1,btnSide:'right',btnOpacity:.7,touchSens:1,
 subs:true,autoAdv:false,allowSkip:true,hud:true,lang:'ko',autosave:60,
 keys:{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD',interact:'KeyE',drop:'KeyQ',light:'KeyF',run:'ShiftLeft',pause:'Escape',skip:'Space'}};
let S=Object.assign({},DEF_SET,store.get('eth_settings_v1',{}));
S.keys=Object.assign({},DEF_SET.keys,S.keys||{});
const saveSettings=()=>store.set('eth_settings_v1',S);
const L=(ko,en)=>S.lang==='en'?en:ko;

/* ===================== 상수 ===================== */
const TS=32;
const DIFFS={
 veryeasy:{ko:'아주 쉬움',en:'Very Easy',ps:1.15,ms:.85,det:.7,stun:1.8,glow:1.4,reg:1.6,lr:1.15,snd:.8,cap:1,reveal:true,drain:.7},
 easy:{ko:'쉬움',en:'Easy',ps:1.07,ms:.93,det:.85,stun:1.3,glow:1.2,reg:1.3,lr:1.08,snd:.9,cap:0,reveal:true,drain:.85},
 normal:{ko:'보통',en:'Normal',ps:1,ms:1,det:1,stun:1,glow:1,reg:1,lr:1,snd:1,cap:0,reveal:false,drain:1},
 hard:{ko:'어려움',en:'Hard',ps:1,ms:1.12,det:1.2,stun:.8,glow:1,reg:.8,lr:.88,snd:1.1,cap:0,reveal:false,drain:1.1},
 nightmare:{ko:'악몽',en:'Nightmare',ps:1,ms:1.25,det:1.4,stun:.65,glow:.7,reg:.65,lr:.78,snd:1.3,cap:0,reveal:false,drain:1.2},
 impossible:{ko:'불가능',en:'Impossible',ps:.98,ms:1.38,det:1.7,stun:.5,glow:.5,reg:.5,lr:.65,snd:1.6,cap:0,reveal:false,drain:1.3}
};
const DIFF_ORDER=['veryeasy','easy','normal','hard','nightmare','impossible'];
// 층별 규칙 (key: 층 번호)
const FLOORS={
 6:{w:34,h:26,keys:3,br:0,ab:0,mon:1,curse:0},
 5:{w:42,h:32,keys:4,br:0,ab:1,mon:1,curse:0},
 4:{w:52,h:38,keys:5,br:0,ab:2,mon:1,curse:0},
 3:{w:62,h:44,keys:6,br:1,ab:3,mon:1,curse:0},
 2:{w:74,h:52,keys:7,br:2,ab:3,mon:1,curse:1},
 1:{w:88,h:62,keys:8,br:3,ab:3,mon:3,curse:1}
};
const ABILS=['sight','hear','presence','speed','clone'];
const ABIL_NAME={sight:['시각','Sight'],hear:['청각','Hearing'],presence:['인기척 감지','Presence'],speed:['이동 속도 증가','Speed Up'],clone:['괴물 복제','Duplication'],smell:['후각','Smell']};
const ABIL_DESC={sight:['빛이 있는 곳의 플레이어를 시야 안에서 발견한다','Spots a lit player inside its view cone'],hear:['문·낙하·차단기 소리를 듣고 소리가 난 곳으로 간다','Investigates door, drop and breaker noises'],presence:['가까이 가면 벽 너머에서도 무조건 감지한다','Always senses you at close range, even through walls'],speed:['눈에 띄게 빨라진다','Moves noticeably faster'],clone:['괴물의 수가 늘어난다','More monsters roam this floor'],smell:['플레이어가 지나간 흔적을 따라온다','Follows your trail']};
const CURSE_NAME={eye:['시력 감퇴','Failing Sight'],ear:['청력 감퇴','Failing Hearing']};
const CURSE_DESC={eye:['화면이 어두워지고 빛이 약해진다','The screen darkens and lights weaken'],ear:['먼 소리가 작아진다','Distant sounds fade']};
const floorLabel=f=>f>=1?f+L('층','F'):'B'+(1-f)+L('층','F');
const ROOM_NAME={hall:['복도','Hallway'],living:['거실','Living Room'],kitchen:['주방','Kitchen'],bed:['침실','Bedroom'],bath:['화장실','Bathroom'],store:['창고','Storage'],small:['작은 방','Small Room'],wide:['넓은 방','Large Room'],study:['서재','Study']};

/* ===================== 오디오 (Web Audio, 외부 파일 없음) ===================== */
const AU={ctx:null,master:null,gains:{},noiseBuf:null,ready:false,drone:null,beat:0,lastBeat:0,ending:null};
function auInit(){
 if(AU.ready){if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();return}
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();AU.master=c.createGain();AU.master.connect(c.destination);
  for(const k of ['music','sfx','monster','ambient','steps','cut']){const g=c.createGain();g.connect(AU.master);AU.gains[k]=g}
  const len=c.sampleRate*1.5,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noiseBuf=b;AU.ready=true;auVol();
  // 환경 드론 (처음엔 거의 안 들림)
  const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
  o1.type='sawtooth';o1.frequency.value=43;o2.type='sine';o2.frequency.value=64.5;f.type='lowpass';f.frequency.value=150;g.gain.value=.0;
  o1.connect(f);o2.connect(f);f.connect(g);g.connect(AU.gains.ambient);o1.start();o2.start();
  const o3=c.createOscillator(),g3=c.createGain();o3.type='triangle';o3.frequency.value=311;g3.gain.value=0;o3.connect(g3);g3.connect(AU.gains.music);o3.start();
  AU.drone={g,f,o1,o2,o3,g3};
 }catch(e){AU.ready=false}
}
function auVol(){if(!AU.ready)return;AU.master.gain.value=S.master;for(const k in AU.gains)AU.gains[k].gain.value=S[k]}
function auTension(t){ // 0..1
 if(!AU.ready||!AU.drone)return;const n=AU.ctx.currentTime;
 AU.drone.g.gain.setTargetAtTime(.012+t*.16,n,.4);AU.drone.f.frequency.setTargetAtTime(110+t*260,n,.4);
 AU.drone.o3.frequency.setTargetAtTime(311+t*40,n,.5);AU.drone.g3.gain.setTargetAtTime(Math.max(0,t-.45)*.06,n,.3);
}
function tone(o){ // {f,f2,d,type,v,a,at,bus,delay}
 if(!AU.ready)return;const c=AU.ctx,t0=c.currentTime+(o.delay||0),osc=c.createOscillator(),g=c.createGain();
 osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t0);if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t0+o.d);
 const v=(o.v||.3)*(o.vol==null?1:o.vol);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+(o.at||.005));g.gain.exponentialRampToValueAtTime(.0001,t0+o.d);
 osc.connect(g);g.connect(AU.gains[o.bus||'sfx']);osc.start(t0);osc.stop(t0+o.d+.05);
}
function noise(o){ // {d,f,f2,q,v,type,bus,delay,vol}
 if(!AU.ready)return;const c=AU.ctx,t0=c.currentTime+(o.delay||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=AU.noiseBuf;f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||800,t0);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+o.d);f.Q.value=o.q||1;
 const v=(o.v||.3)*(o.vol==null?1:o.vol);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+(o.at||.004));g.gain.exponentialRampToValueAtTime(.0001,t0+o.d);
 s.connect(f);f.connect(g);g.connect(AU.gains[o.bus||'sfx']);s.start(t0,Math.random()*.5);s.stop(t0+o.d+.05);
}
// 거리/벽 감쇠 + 청력 저주 반영
function spatialVol(x,y,maxD,close){
 if(typeof G==='undefined'||!G||!G.player)return 1;
 const p=G.player;let d=dist(x,y,p.x,p.y);const cur=G.curses&&G.curses.includes('ear');
 const md=maxD*(cur?.5:1);if(d>=md)return 0;
 let occ=G.map?wallsBetween(G.map,p.x,p.y,x,y):0;
 let v=Math.pow(1-d/md,cur?2.2:1.5)*Math.pow(.55,occ);
 if(close&&d<close)v=Math.max(v,1-d/close*.2);
 return clamp(v,0,1);
}
const SFX={
 stepP(run){noise({d:.07,f:run?700:420,q:.8,v:.12,bus:'steps'});tone({f:80,f2:50,d:.08,v:.1,bus:'steps'})},
 stepM(vol,boss){if(vol<.01)return;noise({d:.16,f:boss?160:260,type:'lowpass',v:.5,vol,bus:'monster'});tone({f:boss?42:58,f2:30,d:.2,v:.5,vol,bus:'monster'})},
 door(open,vol,kind){if(vol<.01)return;const k=(kind||0)%4;
  if(open){tone({f:150+k*30,f2:90+k*50,d:.55,type:'sawtooth',v:.1,vol,at:.08});noise({d:.4,f:900+k*200,f2:300,q:3,v:.12,vol,at:.05});tone({f:110,f2:70,d:.12,v:.2,vol,delay:.5})}
  else{noise({d:.16,f:220,type:'lowpass',v:.7,vol});tone({f:90,f2:40,d:.18,v:.5,vol});tone({f:300+k*40,d:.05,v:.08,vol,delay:.02})}},
 pick(){tone({f:520,f2:780,d:.12,v:.18});tone({f:780,d:.18,v:.12,delay:.06})},
 key(){tone({f:1318,d:.5,v:.16});tone({f:1760,d:.6,v:.12,delay:.08});tone({f:2093,d:.7,v:.08,delay:.16})},
 drop(vol){noise({d:.2,f:320,type:'lowpass',v:.6,vol:vol==null?1:vol});tone({f:130,f2:60,d:.2,v:.4,vol:vol==null?1:vol})},
 breaker(vol){noise({d:.35,f:180,type:'lowpass',v:.9,vol});tone({f:60,f2:35,d:.5,v:.8,vol});tone({f:880,f2:120,d:.7,type:'sawtooth',v:.2,vol,delay:.1});noise({d:.6,f:2500,f2:400,q:2,v:.3,vol,delay:.15})},
 trap(vol){noise({d:.1,f:3000,q:2,v:.5,vol});tone({f:1200,f2:90,d:.35,type:'square',v:.2,vol});noise({d:.4,f:4000,f2:300,v:.25,vol,delay:.05})},
 stun(vol){tone({f:300,f2:60,d:.9,type:'sawtooth',v:.28,vol:vol==null?1:vol,bus:'monster'});noise({d:.7,f:500,f2:100,q:4,v:.3,vol:vol==null?1:vol,bus:'monster'})},
 appear(){tone({f:70,f2:40,d:1.6,type:'sawtooth',v:.35,bus:'monster',at:.3});noise({d:1.4,f:300,f2:80,q:3,v:.3,bus:'monster',at:.4});tone({f:1900,f2:1300,d:1.2,type:'triangle',v:.05,bus:'monster',at:.5})},
 growl(vol){tone({f:90,f2:55,d:1,type:'sawtooth',v:.4,vol:vol==null?1:vol,bus:'monster',at:.1});noise({d:.9,f:260,q:5,v:.25,vol:vol==null?1:vol,bus:'monster'})},
 death(){tone({f:200,f2:30,d:1.4,type:'sawtooth',v:.45});noise({d:1,f:900,f2:60,q:2,v:.5});tone({f:55,d:2,v:.5,delay:.2})},
 unlock(){[0,.12,.24,.36].forEach((d,i)=>tone({f:440*Math.pow(1.26,i),d:.4,v:.14,delay:d,type:'triangle'}));noise({d:.2,f:2000,q:4,v:.1})},
 boss(){tone({f:45,f2:28,d:3,type:'sawtooth',v:.5,bus:'monster',at:.5});tone({f:90,f2:50,d:3,type:'square',v:.2,bus:'monster',at:.6});noise({d:2.6,f:200,f2:60,q:2,v:.5,bus:'monster',at:.3})},
 bossStun(){SFX.stun(1);tone({f:150,f2:30,d:1.4,type:'sawtooth',v:.45,bus:'monster'});noise({d:.5,f:6000,f2:400,v:.4})},
 ach(){tone({f:659,d:.25,v:.15});tone({f:880,d:.25,v:.15,delay:.12});tone({f:1318,d:.5,v:.15,delay:.24})},

 {let sx2=-1,sy2=-1;for(let i=0;i<W*M.h&&sx2<0;i++)if(M.tiles[i]===0&&!M.furn[i]){sx2=i%W;sy2=(i/W)|0}const f=passableFlood(M,sx2,sy2);if(f.n!==freeCount(M)){M.furn[idx(st[0],st[1])]=0;M.furn[idx(st[0],st[1])]=0;return buildLevel(seed+1)}}

  while(d<r){d+=st;if(blocksSight(M,Math.floor(wx+c*d),Math.floor(wy+s*d))){d+=.35;break}}

const SAVE_KEY='eth_save_v1';

function serialize(){
 if(!G||!G.map)return null;
 const base={v:1,mode:G.mode,dk:G.dk,custom:G.custom,seedBase:G.seedBase,deaths:G.deaths,curseOrder:G.curseOrder,fcurse:G.floorCurse,runTime:G.runTime,time:Date.now(),noCurse:!!G.noCurse};
 if(G.bossMode)return Object.assign(base,{boss:true,seed:G.seed,floor:0.5});
 const p=G.player;
 return Object.assign(base,{floor:G.floor,seed:G.seed,keys:G.keys,br:G.br,stairsOpen:G.stairsOpen,keyGot:G.keyGot,lampUsed:G.lampUsed,ftime:G.time,
  hold:p.hold,px:p.x,py:p.y,pang:p.ang,stam:p.stam,items:G.items,doors:G.map.doors.map(d=>d.open?1:0),
  mons:G.monsters.map(m=>({x:m.x,y:m.y,abil:m.abil,ang:m.ang,tint:m.tint})),revealed:G.revealed,abilList:G.abilList});
}
function saveGame(manual){
 if(!G||!G.map||G.state==='dead')return false;if(G.cutId)return false;
 const d=serialize();if(!d)return false;const ok=store.set(SAVE_KEY,d);G.savedAt=Date.now();
 if(manual)toast(ok?L('저장되었습니다','Game saved'):L('저장에 실패했습니다','Save failed'));return ok;
}
function restoreGame(sv){
 newRun(sv.mode,sv.dk,sv.custom);G.seedBase=sv.seedBase;G.deaths=sv.deaths||0;G.curseOrder=sv.curseOrder||G.curseOrder;G.floorCurse=sv.fcurse||null;G.runTime=sv.runTime||0;G.noCurse=!!sv.noCurse;
 if(sv.boss){startBossLevel(sv.seed);bossReset();STATS.bossTry++;return}
 G.floor=sv.floor;G.curses=curseFor(G.floor,false);G.bossMode=false;buildLevel(sv.seed);
 G.keys=sv.keys||0;G.br=sv.br||0;G.stairsOpen=!!sv.stairsOpen;G.keyGot=sv.keyGot||0;G.lampUsed=!!sv.lampUsed;G.time=sv.ftime||0;
 if(sv.items)G.items=sv.items;G.uid=Math.max(...G.items.map(i=>i.id),0)+1;
 sv.doors.forEach((o,i)=>{const d=G.map.doors[i];if(d){d.open=!!o;d.t=o?1:0}});
 const p=G.player;p.x=sv.px;p.y=sv.py;p.ang=sv.pang||0;p.stam=sv.stam==null?100:sv.stam;p.hold=sv.hold||null;
 if(sv.mons&&sv.mons.length){G.monsters=sv.mons.map(o=>{const m=mkMonster(o.x,o.y,o.abil,false);m.ang=o.ang||0;m.tint=o.tint;return m})}

(function(){
 const jz=$('joyzone'),base=$('joybase'),st=$('joystick');let pid=null,cx=0,cy=0,R=60;
 const setStick=(x,y)=>{st.style.left=(R-R*.42+x*R*.7)+'px';st.style.top=(R-R*.42+y*R*.7)+'px'};
 jz.addEventListener('pointerdown',e=>{e.preventDefault();auInit();if(G&&G.dialog){advanceDialog();return}if(pid!==null)return;pid=e.pointerId;try{jz.setPointerCapture(pid)}catch(x){}
  R=Math.min(innerWidth,innerHeight)*.13*S.joySize;cx=e.clientX;cy=e.clientY;base.style.display='block';base.style.width=base.style.height=R*2+'px';base.style.left=(cx-R)+'px';base.style.top=(cy-R)+'px';st.style.width=st.style.height=R*.84+'px';setStick(0,0);INP.joy.on=true;INP.joy.x=0;INP.joy.y=0});
 jz.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;let dx=(e.clientX-cx)/R,dy=(e.clientY-cy)/R;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}setStick(dx,dy);const mm=Math.min(1,m);
  if(mm<.14){INP.joy.x=0;INP.joy.y=0}else{const k=Math.min(1,(mm-.14)/.6)*S.touchSens;INP.joy.x=dx/Math.max(m,.001)*Math.min(1,k);INP.joy.y=dy/Math.max(m,.001)*Math.min(1,k)}});
 const end=e=>{if(e.pointerId!==pid)return;pid=null;base.style.display='none';INP.joy.on=false;INP.joy.x=0;INP.joy.y=0};
 jz.addEventListener('pointerup',end);jz.addEventListener('pointercancel',end);
 const tap=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();auInit();if(G&&G.dialog){advanceDialog();return}if(G&&G.state==='play')fn()});
 tap('tbE',doInteract);tap('tbQ',dropItem);tap('tbL',toggleLamp);
 const rb=$('tbR');rb.addEventListener('pointerdown',e=>{e.preventDefault();INP.touchRun=true;rb.classList.add('on')});
 const ru=()=>{INP.touchRun=false;rb.classList.remove('on')};rb.addEventListener('pointerup',ru);rb.addEventListener('pointercancel',ru);rb.addEventListener('pointerleave',ru);
})();
